name: Containers

# Tests with real containers, apart from CI since they need Docker and take
# minutes. On arm64 like a Pi, and only for what they cover: development
# stacks, and the images a host runs, which stage the apps' packages.
on:
  pull_request:
    paths:
      - apps/core/Dockerfile
      - apps/manager/**
      - catalog/apps/**
      - deploy/**
      - packages/app-sdk/**
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/containers.yml
  push:
    branches: [main]
    paths:
      - apps/core/Dockerfile
      - apps/manager/**
      - catalog/apps/**
      - deploy/**
      - packages/app-sdk/**
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/containers.yml

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the stacks run, and in which groups. Any of the paths above runs
  # them, but the lockfile only when it changes what they install: a
  # dependency of the website alone changes nothing there.
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      run: ${{ steps.changes.outputs.run }}
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit the change goes onto is compared with it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Check what changed
        id: changes
        env:
          # A pull request runs on its merge into its base, whose first
          # parent is that base; a push to main on main as it was.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # What the stacks install at a commit, read from its lockfile.
          installs() {
            local dir
            # As pnpm prints it, through any symlink.
            dir="$(cd "$(mktemp -d)" && pwd -P)"
            git archive "$1" | tar -x -C "$dir" || return
            (cd "$dir" && pnpm list -r --lockfile-only --depth Infinity --parseable \
              --filter './apps/core...' --filter './apps/manager...' \
              --filter './catalog/apps/*...' --filter './deploy/dev/apps/*...') |
              sed "s|^$dir/||" | sort -u
          }
          # Whatever this can't tell runs them.
          changed() {
            git rev-parse -q --verify "$BASE^{commit}" >/dev/null || return 0
            files="$(git diff --name-only "$BASE" HEAD)"
            # The paths above but the lockfile.
            grep -qE '^(apps/core/Dockerfile|apps/manager/|catalog/apps/|deploy/|packages/app-sdk/|turbo\.json|\.github/workflows/containers\.yml)' <<<"$files" && return 0
            grep -qxF pnpm-lock.yaml <<<"$files" || return 0
            installs "$BASE" >"$RUNNER_TEMP/before" && installs HEAD >"$RUNNER_TEMP/after" || return 0
            if cmp -s "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"; then
              echo "The lockfile changes nothing the stacks install."
              return 1
            fi
            echo "The lockfile changes what the stacks install:"
            diff "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" || true
          }
          if changed; then echo run=true; else echo run=false; fi >>"$GITHUB_OUTPUT"
      # The container tests in groups of about the same length, each on a
      # runner of its own. A file no group names runs on its own.
      - name: Group the tests
        id: groups
        run: |
          groups='[["official-moves"], ["two-stacks", "app-containers", "app-move"], ["app-images", "packages"], ["app-supervision", "app-update"]]'
          files="$(cd apps/manager/test && ls -- *.docker.ts | sed 's/\.docker\.ts$//' | jq -Rnc '[inputs]')"
          jq -rn --argjson groups "$groups" --argjson files "$files" \
            '"groups=" + ($groups + ($files - ($groups | add) | map([.])) | map(join(" ")) | tojson)' >>"$GITHUB_OUTPUT"

  stacks:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      # One group failing says nothing about the others.
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ubuntu-24.04-arm
    env:
      # Nothing here runs the desktop app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest runs the files that match, and fails if none does.
      - run: pnpm test:containers -- $(printf 'test/%s.docker.ts ' $TESTS)
        env:
          TESTS: ${{ matrix.tests }}
