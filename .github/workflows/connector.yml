name: Connector

# Stages @meetsanctum/mcp, the connector AI agents run, on npm from a tag
# mcp-vX.Y.Z. A staged version is installable only once a maintainer approves
# it on npmjs.com with two-factor authentication, so nothing reaches anyone's
# computer without a person's say.
#
# npm trusts this workflow through OIDC (trusted publishing), with no token
# stored here, and attaches provenance. A trusted publisher can only be set on
# a package that exists, so while the repository has an NPM_TOKEN secret, a
# short-lived token stages instead, with provenance still from OIDC.
on:
  push:
    tags: ["mcp-v*.*.*"]

permissions:
  contents: read
  # Trusted publishing and provenance.
  id-token: write

concurrency:
  group: connector-${{ github.ref }}

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install --global npm@11.21.3
      - run: pnpm install --frozen-lockfile
      # Settings' prompt pins the connector's version, and the connector's
      # tests hold that pin to its package.json: the tag must name it too.
      - name: Check the tag names the package's version
        run: |
          version="$(jq -r .version packages/mcp/package.json)"
          if [ "${GITHUB_REF_NAME#mcp-v}" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME doesn't match @meetsanctum/mcp $version"
            exit 1
          fi
      - run: pnpm --filter @meetsanctum/mcp... typecheck
      - run: pnpm --filter @meetsanctum/mcp... test
      - run: pnpm --filter @meetsanctum/mcp... build
      # pnpm packs it, which turns workspace versions into real ones, and the
      # tarball must hold only the bundled connector, its README and licence.
      - name: Pack and check what goes out
        working-directory: packages/mcp
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/meetsanctum-mcp-*.tgz)"
          listed="$(tar -tzf "$tarball" | sort | tr '\n' ' ')"
          expected="package/LICENSE package/README.md package/dist/cli.js package/package.json "
          if [ "$listed" != "$expected" ]; then
            echo "::error::The package holds: $listed"
            exit 1
          fi
          if tar -xzOf "$tarball" package/dist/cli.js | grep -Eq '(from |import\()"@meetsanctum/'; then
            echo "::error::dist/cli.js imports a workspace package instead of bundling it"
            exit 1
          fi
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
      # npm stages the package pnpm packed, as it unpacks.
      - name: Stage it on npm
        working-directory: ${{ runner.temp }}/package
        run: npm stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
