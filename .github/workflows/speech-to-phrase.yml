name: Speech-to-Phrase

# Sanctum's image of Speech-to-Phrase (deploy/speech-to-phrase), which keeps
# a version of its own, as the other services' images do.
# - a pull request that changes it -> built for both platforms, not pushed
# - tag speech-to-phrase-vX.Y.Z    -> published as :X.Y.Z
on:
  pull_request:
    paths:
      - "deploy/speech-to-phrase/**"
      - ".github/workflows/speech-to-phrase.yml"
  push:
    tags: ["speech-to-phrase-v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sanctum-speech-to-phrase

jobs:
  build:
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed untagged; the publish job tags both platforms' images as one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/speech-to-phrase
          platforms: linux/${{ matrix.platform }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}
          tags: ${{ github.event_name == 'push' && '' || 'sanctum-speech-to-phrase:check' }}
          cache-from: type=gha,scope=speech-to-phrase-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=speech-to-phrase-${{ matrix.platform }}
      # The image starts, and answers a describe before it is taught.
      - if: github.event_name != 'push'
        run: |
          docker run -d --name stp -p 10300:10300 sanctum-speech-to-phrase:check
          for _ in $(seq 60); do
            if echo '{"type": "describe"}' | nc -w 1 127.0.0.1 10300 | grep -q '"asr"'; then
              docker rm -f stp >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs stp
          exit 1
      - if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-speech-to-phrase-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digests-speech-to-phrase-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@v8
        with:
          name: digests-speech-to-phrase-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#speech-to-phrase-v}"
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:$version" "${images[@]}"
