name: Speech-to-Phrase

# Sanctum's image of Speech-to-Phrase (deploy/speech-to-phrase), which keeps
# a version of its own, as the other services' images do.
# - changes on pull requests and main -> built for both platforms, not pushed
# - tag speech-to-phrase-vX.Y.Z    -> published as :X.Y.Z
on:
  pull_request:
    paths: &image-paths
      - "deploy/speech-to-phrase/**"
      - ".github/workflows/speech-to-phrase.yml"
  push:
    branches: [main]
    paths: *image-paths
    tags: ["speech-to-phrase-v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sanctum-speech-to-phrase

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy: &platforms
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/speech-to-phrase
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: sanctum-speech-to-phrase:check
          cache-from: type=gha,scope=speech-to-phrase-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=speech-to-phrase-${{ matrix.platform }}
      - name: Test grammar updates and Wyoming events
        run: |
          docker run --rm --entrypoint python3 \
            -e PYTHONPATH=/usr/src/src:/usr/src \
            -v "$PWD/deploy/speech-to-phrase:/checks:ro" \
            sanctum-speech-to-phrase:check -m unittest discover -s /checks
      - name: Read the pinned model cache key
        id: model
        run: |
          model=$(docker run --rm --entrypoint python3 sanctum-speech-to-phrase:check \
            -c 'from sanctum_server import BACKEND, models; print(models.HF_REVISION, models.model_name_for("en", BACKEND), sep="-")')
          echo "key=speech-to-phrase-models-$model" >> "$GITHUB_OUTPUT"
      # Runs on main populate a cache that later pull requests can restore.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/speech-to-phrase-data/models
          key: ${{ steps.model.outputs.key }}
      - name: Teach and recognize a command
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          lights_audio="$RUNNER_TEMP/lights.wav"
          undo_audio="$RUNNER_TEMP/undo.wav"
          espeak-ng -v en-us -s 145 -w "$lights_audio" 'turn on the kitchen lights'
          espeak-ng -v en-us -s 145 -w "$undo_audio" 'undo it'
          export SANCTUM_TRAIN_TOKEN="$(openssl rand -hex 32)"
          data="$RUNNER_TEMP/speech-to-phrase-data"
          mkdir -p "$data"
          docker run -d --name stp --user "$(id -u):$(id -g)" --env SANCTUM_TRAIN_TOKEN \
            -v "$data:/data" \
            -p 127.0.0.1:10300:10300 sanctum-speech-to-phrase:check
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs stp; fi; docker rm -fv stp >/dev/null' EXIT
          python3 deploy/speech-to-phrase/smoke_test.py "$lights_audio" "$undo_audio"

  release-build:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    strategy: *platforms
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed untagged; the publish job tags both platforms' images as one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/speech-to-phrase
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=speech-to-phrase-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=speech-to-phrase-${{ matrix.platform }}
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-speech-to-phrase-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digests-speech-to-phrase-amd64
          path: ${{ runner.temp }}/digests
      - uses: actions/download-artifact@v8
        with:
          name: digests-speech-to-phrase-arm64
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#speech-to-phrase-v}"
          images=()
          for digest in *; do images+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:$version" "${images[@]}"
