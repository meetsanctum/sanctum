<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%PRODUCT_NAME% · Open source home automation</title>
    <meta
      name="description"
      content="%PRODUCT_NAME% is open source home automation that runs on a small computer in your home. It works without the internet, and your devices, automations and data stay in your home, under your control."
    />
    <link rel="icon" href="%BRAND_MARK%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="page">
      <a class="logo" href="/">
        <svg viewBox="0 0 14 14" width="28" height="28" aria-hidden="true">
          <path
            fill="currentColor"
            d="M6 11A1 1 0 0 0 8 11L10 11A3 3 0 0 1 4 11L4 7L6 7ZM7 6L3 6A1 1 0 0 0 3 8L3 10A3 3 0 0 1 3 4L7 4ZM11 10L7 10L7 8L11 8A1 1 0 0 0 11 6L11 4A3 3 0 0 1 11 10ZM10 3L10 7L8 7L8 3A1 1 0 0 0 6 3L4 3A3 3 0 0 1 10 3Z"
          />
        </svg>
        <span>%PRODUCT_NAME%</span>
      </a>

      <!-- The glass effect's root: the GitHub button is frosted glass over
           the photo, so the photo, the veil and the button are its direct
           children, and nothing else is. -->
      <div class="scene">
        <img class="backdrop" src="%BRAND_PHOTO%" alt="" />
        <div class="veil"></div>
        <a
          class="github"
          id="github"
          href="https://github.com/meetsanctum/sanctum"
        >
          <span class="label">
            <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
              />
            </svg>
            <span>GitHub</span>
            <span class="stars" id="stars" hidden>
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path
                  d="M12 4.5l2.3 4.7 5.2.8-3.75 3.65.9 5.15L12 16.4l-4.65 2.4.9-5.15L4.5 10l5.2-.8z"
                />
              </svg>
              <span id="star-count"></span>
              <span class="visually-hidden">stars</span>
            </span>
          </span>
        </a>
      </div>

      <main class="content">
        <h1>Home automation that stays at home</h1>
        <p class="description">
          %PRODUCT_NAME% is open source home automation that runs on a small
          computer in your home. It works without the internet and needs no
          cloud account. Your devices, automations and data stay in your home,
          under your control.
        </p>
        <!-- Never send an address, even before JavaScript loads. -->
        <form class="waitlist" id="waitlist" method="dialog">
          <label class="visually-hidden" for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Email address"
            required
          />
          <button class="primary" type="submit">Join the waitlist</button>
        </form>
        <p class="note" id="waitlist-note" aria-live="polite"></p>
      </main>
    </div>
  </body>
</html>
