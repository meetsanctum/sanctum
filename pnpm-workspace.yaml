packages:
  - "apps/*"
  - "packages/*"
  - "catalog/apps/*"
  # A development stack's own apps, which only it stages.
  - "deploy/dev/apps/*"
  - "assets/brand"

# Electron downloads its binary when installed. CI skips the download
# (ELECTRON_SKIP_BINARY_DOWNLOAD), since nothing there runs it.
onlyBuiltDependencies:
  - electron
