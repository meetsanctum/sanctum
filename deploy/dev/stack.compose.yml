# A development stack, which deploy/dev/stack.sh starts with its settings. As
# on a host (deploy/compose.yml), Compose starts only the manager, on Docker's
# host network, and the manager creates the core and the services. What
# differs: every name carries the stack's, so stacks can share a Docker, and
# there is no /dev, no mDNS and no restart with Docker. Apps' packages come
# from the worktree, staged again with each build.
name: sanctum-${SANCTUM_STACK:?}

services:
  manager:
    image: sanctum-${SANCTUM_STACK}-manager:dev
    container_name: sanctum-${SANCTUM_STACK}-manager
    network_mode: host
    labels:
      sanctum.stack: ${SANCTUM_STACK}
    environment:
      SANCTUM_CHANNEL: dev
      SANCTUM_STACK: ${SANCTUM_STACK}
      SANCTUM_DEV_REGISTRY: localhost:${SANCTUM_STACK_REGISTRY_PORT:?}
      SANCTUM_STACK_CORE_IMAGE: sanctum-${SANCTUM_STACK}-core:dev
      SANCTUM_STACK_CORE_PORT: ${SANCTUM_STACK_PORT:?}
      SANCTUM_STACK_CORE_BINDS: ${SANCTUM_STACK_CORE_BINDS:?}
      SANCTUM_STACK_CORE_ENV: ${SANCTUM_STACK_CORE_ENV:-}
      MANAGER_CORE_URL: ${SANCTUM_STACK_CORE_URL:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manager-data:/data
      - core-data:/core-data
      - manager-socket:/run/sanctum
      - ../../apps/manager/dist:/app/apps/manager/dist:ro
      # The worktree's apps and the app SDK as last built, which it stages with
      # the dependencies its image holds, again whenever their build changes.
      - ../../catalog/apps:/app/stack-sources/catalog/apps:ro
      - ../../deploy/dev/apps:/app/stack-sources/deploy/dev/apps:ro
      - ../../packages/app-sdk/dist:/app/stack-sources/packages/app-sdk/dist:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Only for updating a stack, as in its test: a dev host's registry, of its own.
  registry:
    profiles: [registry]
    image: registry:3.0.0
    container_name: sanctum-${SANCTUM_STACK}-registry
    labels:
      sanctum.stack: ${SANCTUM_STACK}
    ports:
      - "127.0.0.1:${SANCTUM_STACK_REGISTRY_PORT}:5000"
    environment:
      REGISTRY_LOG_LEVEL: info
      OTEL_TRACES_EXPORTER: none
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

# Compose's own, which only the registry joins: labelled like everything else
# of the stack's, so removing the stack removes it too.
networks:
  default:
    labels:
      sanctum.stack: ${SANCTUM_STACK}

volumes:
  manager-data:
    name: sanctum-${SANCTUM_STACK}-manager-data
    labels:
      sanctum.stack: ${SANCTUM_STACK}
  core-data:
    name: sanctum-${SANCTUM_STACK}-core-data
    labels:
      sanctum.managed: "true"
      sanctum.stack: ${SANCTUM_STACK}
  manager-socket:
    name: sanctum-${SANCTUM_STACK}-manager-socket
    labels:
      sanctum.managed: "true"
      sanctum.stack: ${SANCTUM_STACK}
  registry-data:
    name: sanctum-${SANCTUM_STACK}-registry-data
    labels:
      sanctum.stack: ${SANCTUM_STACK}
